<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelayAI - Browser Phone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 40px;
        }
        .status {
            padding: 12px 24px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status.connecting {
            background: #332800;
            color: #fbbf24;
        }
        .status.ready {
            background: #052e16;
            color: #4ade80;
        }
        .status.ringing {
            background: #1e1b4b;
            color: #a78bfa;
            animation: pulse 1s infinite;
        }
        .status.on-call {
            background: #052e16;
            color: #4ade80;
        }
        .status.error {
            background: #450a0a;
            color: #f87171;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .phone-number {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }
        .btn {
            padding: 16px 48px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-answer {
            background: #22c55e;
            color: white;
        }
        .btn-answer:hover {
            background: #16a34a;
        }
        .btn-hangup {
            background: #ef4444;
            color: white;
        }
        .btn-hangup:hover {
            background: #dc2626;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .hidden {
            display: none;
        }
        .call-info {
            margin-top: 20px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 12px;
        }
        .call-info p {
            color: #888;
            font-size: 14px;
        }
        .caller {
            font-size: 18px;
            color: #fafafa;
            margin-top: 8px;
        }
        .timer {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RelayAI Browser Phone</h1>
        <p class="subtitle">Receive test calls in your browser</p>

        <div id="status" class="status connecting">Connecting to Twilio...</div>

        <div id="idle-state">
            <p class="phone-number">Waiting for incoming calls...</p>
        </div>

        <div id="ringing-state" class="hidden">
            <div class="call-info">
                <p>Incoming call from</p>
                <div id="caller" class="caller">Unknown</div>
            </div>
            <button id="answer-btn" class="btn btn-answer" style="margin-top: 20px;">
                Answer Call
            </button>
        </div>

        <div id="call-state" class="hidden">
            <div class="call-info">
                <p>On call with</p>
                <div id="caller-active" class="caller">AI Agent</div>
                <div id="timer" class="timer">00:00</div>
            </div>
            <button id="hangup-btn" class="btn btn-hangup" style="margin-top: 20px;">
                Hang Up
            </button>
        </div>
    </div>

    <!-- Bundled Twilio client (built from npm package) -->
    <script src="/static/bundle.js"></script>
</body>
</html>
